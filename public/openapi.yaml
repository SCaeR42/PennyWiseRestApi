openapi: 3.0.3
info:
  title: PennyWise REST API
  description: >
    RESTful API для системы учёта и анализа персональных финансов PennyWise.
    Подробное описание архитектуры — в [Software Design Description](/../docs/SDD.md).
  version: "1.0.0"
  license:
    name: MIT
servers:
  - url: /api/v1
    description: Текущий инстанс (относительно хоста, на котором открыт этот документ)

tags:
  - name: Auth
    description: Выдача, обновление и инвалидация JWT
  - name: Users
    description: Регистрация и профиль пользователя
  - name: Accounts
    description: Банковские счета
  - name: Wallets
    description: Кошельки и их баланс
  - name: Categories
    description: Категории доходов/расходов
  - name: Tags
    description: Теги транзакций
  - name: Transactions
    description: Финансовые операции
  - name: Settings
    description: Пользовательские настройки (key-value)
  - name: Dashboard
    description: Виджеты дашборда
  - name: System
    description: Служебные эндпоинты (health-check)
  - name: EmailVerification
    description: Вспомогательная верификация email (формат + MX)

security:
  - bearerAuth: []

paths:
  /auth/token:
    post:
      tags: [Auth]
      operationId: issueToken
      summary: Получение JWT токена (логин)
      description: >
        Тестовый пользователь для локальной среды разработки: `alice@example.com` /
        `supersecret` (уже засеян в БД). Полученный `access_token` подставь в кнопку
        **Authorize** вверху страницы — тогда все закрытые замком эндпоинты будут
        ходить с этим токеном.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: alice@example.com
              password: supersecret
      responses:
        '200':
          description: Пара access/refresh токенов
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPairResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          description: Неверный email или пароль
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshToken
      summary: Обновление access-токена по refresh-токену
      description: >
        Refresh-токен одноразовый (rotation): при успешном запросе старый jti тут же
        помечается использованным, а клиенту выдаётся новая пара — старый
        refresh_token больше не примется. Повторное предъявление уже
        использованного refresh_token трактуется как компрометация токена и
        немедленно отзывает **все** активные сессии пользователя
        (код ошибки `REFRESH_TOKEN_REUSED`, см. SDD 3.2.2).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token:
                  type: string
      responses:
        '200':
          description: Новая пара access/refresh токенов
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPairResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          description: >
            Невалидный/просроченный/неизвестный refresh-токен, либо обнаружено
            повторное использование уже отозванного токена (`REFRESH_TOKEN_REUSED`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                unrecognized:
                  summary: Токен не найден/просрочен
                  value:
                    success: false
                    error: { code: UNAUTHORIZED, message: "Refresh token not recognized" }
                reused:
                  summary: Обнаружено повторное использование — все сессии отозваны
                  value:
                    success: false
                    error: { code: REFRESH_TOKEN_REUSED, message: "Refresh token reuse detected — all sessions have been revoked" }

  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Отзыв всех refresh-токенов пользователя
      description: >
        Отзывает все активные refresh-токены пользователя (разлогин "везде", без
        разделения по устройствам — см. SDD 10). Текущий access-токен при этом не
        аннулируется мгновенно — он остаётся технически валиден до истечения
        собственного `exp` (по умолчанию ≤ `JWT_TTL` = 900 сек), это осознанный
        компромисс ради stateless-проверки на каждый запрос (см. SDD 3.2.2).
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    properties:
                      message: { type: string, example: "Logged out" }
        '401':
          $ref: '#/components/responses/Unauthorized'

  /users/register:
    post:
      tags: [Users]
      operationId: registerUser
      summary: Регистрация пользователя
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterUserRequest'
      responses:
        '201':
          description: Пользователь создан
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/ValidationError'
        '422':
          description: Email уже занят
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /users/profile:
    get:
      tags: [Users]
      operationId: getUserProfile
      summary: Получение профиля текущего пользователя
      responses:
        '200':
          description: Профиль
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      tags: [Users]
      operationId: updateUserProfile
      summary: Обновление профиля
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: Обновлённый профиль
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          description: Email уже занят
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags: [Users]
      operationId: deleteUserAccount
      summary: Удаление аккаунта
      responses:
        '204':
          description: Удалено
        '401':
          $ref: '#/components/responses/Unauthorized'

  /accounts:
    get:
      tags: [Accounts]
      operationId: listAccounts
      summary: Список счетов
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Список счетов
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Accounts]
      operationId: createAccount
      summary: Создание счёта
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAccountRequest'
      responses:
        '201':
          description: Счёт создан
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    $ref: '#/components/schemas/Account'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /accounts/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Accounts]
      operationId: getAccount
      summary: Получение счёта
      responses:
        '200':
          description: Счёт
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    $ref: '#/components/schemas/Account'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Accounts]
      operationId: updateAccount
      summary: Обновление счёта
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAccountRequest'
      responses:
        '200':
          description: Обновлённый счёт
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    $ref: '#/components/schemas/Account'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Accounts]
      operationId: deleteAccount
      summary: Удаление счёта
      responses:
        '204':
          description: Удалено
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: "Есть кошельки, привязанные к этому счёту (`ACCOUNT_HAS_LINKED_WALLETS`) — сначала отвязать/удалить их"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error: { code: ACCOUNT_HAS_LINKED_WALLETS, message: "Cannot delete account: it is still linked to one or more wallets" }

  /wallets:
    get:
      tags: [Wallets]
      operationId: listWallets
      summary: Список кошельков
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Список кошельков
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Wallets]
      operationId: createWallet
      summary: Создание кошелька
      description: >
        `is_default` эксклюзивен на пользователя: если передать `true`, флаг
        автоматически снимается со всех остальных кошельков этого пользователя
        в той же операции.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWalletRequest'
      responses:
        '201':
          description: Кошелёк создан
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    $ref: '#/components/schemas/Wallet'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /wallets/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Wallets]
      operationId: getWallet
      summary: Получение кошелька
      responses:
        '200':
          description: Кошелёк
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    $ref: '#/components/schemas/Wallet'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Wallets]
      operationId: updateWallet
      summary: Обновление кошелька
      description: >
        `is_default=true` снимает флаг со всех остальных кошельков этого
        пользователя — эксклюзивность гарантируется на уровне сервиса.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateWalletRequest'
      responses:
        '200':
          description: Обновлённый кошелёк
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    $ref: '#/components/schemas/Wallet'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Wallets]
      operationId: deleteWallet
      summary: Удаление кошелька
      responses:
        '204':
          description: Удалено
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /wallets/{id}/balance:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Wallets]
      operationId: getWalletBalance
      summary: Баланс кошелька
      responses:
        '200':
          description: Текущий баланс
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    properties:
                      wallet_id: { type: integer, example: 1 }
                      balance: { type: number, format: float, example: 3500.00 }
                      currency: { type: string, example: RUB }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /categories:
    get:
      tags: [Categories]
      operationId: listCategories
      summary: Список категорий
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Список категорий
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Categories]
      operationId: createCategory
      summary: Создание категории
      description: >
        Вложенность ограничена одним уровнем: `parent_id` обязан указывать на
        категорию без собственного родителя (root-категорию).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCategoryRequest'
      responses:
        '201':
          description: Категория создана
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    $ref: '#/components/schemas/Category'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /categories/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Categories]
      operationId: getCategory
      summary: Получение категории
      responses:
        '200':
          description: Категория
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    $ref: '#/components/schemas/Category'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Categories]
      operationId: updateCategory
      summary: Обновление категории
      description: >
        Вложенность ограничена одним уровнем: новый `parent_id` обязан указывать на
        root-категорию, а категория с собственными детьми не может получить
        родителя (сначала нужно переподчинить/удалить её детей).
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCategoryRequest'
      responses:
        '200':
          description: Обновлённая категория
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    $ref: '#/components/schemas/Category'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Categories]
      operationId: deleteCategory
      summary: Удаление категории
      responses:
        '204':
          description: Удалено
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: "Есть дочерние категории или транзакции, ссылающиеся на эту категорию (`CATEGORY_IN_USE`)"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error: { code: CATEGORY_IN_USE, message: "Cannot delete category: it is still referenced by child categories or transactions" }

  /tags:
    get:
      tags: [Tags]
      operationId: listTags
      summary: Список тегов
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Список тегов
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Tags]
      operationId: createTag
      summary: Создание тега
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTagRequest'
      responses:
        '201':
          description: Тег создан
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    $ref: '#/components/schemas/Tag'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /tags/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    put:
      tags: [Tags]
      operationId: updateTag
      summary: Обновление тега
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTagRequest'
      responses:
        '200':
          description: Обновлённый тег
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    $ref: '#/components/schemas/Tag'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Tags]
      operationId: deleteTag
      summary: Удаление тега
      responses:
        '204':
          description: Удалено
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /transactions:
    get:
      tags: [Transactions]
      operationId: listTransactions
      summary: Список транзакций
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - name: wallet_id
          in: query
          schema: { type: integer }
        - name: category_id
          in: query
          schema: { type: integer }
        - name: type
          in: query
          schema: { type: string, enum: [income, expense] }
        - name: date_from
          in: query
          schema: { type: string, format: date }
        - name: date_to
          in: query
          schema: { type: string, format: date }
      responses:
        '200':
          description: Список транзакций
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Transactions]
      operationId: createTransaction
      summary: Создание транзакции
      description: Пересчитывает `wallets.balance` в той же БД-транзакции (см. SDD 4.2).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTransactionRequest'
      responses:
        '201':
          description: Транзакция создана
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    $ref: '#/components/schemas/Transaction'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /transactions/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Transactions]
      operationId: getTransaction
      summary: Получение транзакции
      responses:
        '200':
          description: Транзакция
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    $ref: '#/components/schemas/Transaction'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Transactions]
      operationId: updateTransaction
      summary: Обновление транзакции
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTransactionRequest'
      responses:
        '200':
          description: Обновлённая транзакция
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    $ref: '#/components/schemas/Transaction'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Transactions]
      operationId: deleteTransaction
      summary: Удаление транзакции
      responses:
        '204':
          description: Удалено
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /settings:
    get:
      tags: [Settings]
      operationId: getSettings
      summary: Получение настроек
      responses:
        '200':
          description: "Карта key → value (значения — произвольный JSON)"
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    additionalProperties: true
                    example: { theme: dark, notifications_enabled: true }
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      tags: [Settings]
      operationId: updateSettings
      summary: Обновление настроек (upsert по ключам)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              minProperties: 1
              example: { theme: dark, notifications_enabled: true }
      responses:
        '200':
          description: Актуальная карта настроек после обновления
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    additionalProperties: true
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /dashboard/widgets:
    get:
      tags: [Dashboard]
      operationId: listWidgets
      summary: Список доступных виджетов
      responses:
        '200':
          description: Имена виджетов
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: array
                    items: { type: string }
                    example: [balance-chart, expenses-by-category]
        '401':
          $ref: '#/components/responses/Unauthorized'

  /dashboard/widgets/{name}:
    get:
      tags: [Dashboard]
      operationId: getWidget
      summary: Данные виджета
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string, example: balance-chart }
      responses:
        '200':
          description: Данные виджета (форма зависит от конкретного виджета)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: array
                    items: { type: object }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Такого виджета нет
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /health:
    get:
      tags: [System]
      operationId: getHealth
      summary: "Проверка живости приложения (без авторизации, используется Docker healthcheck)"
      security: []
      responses:
        '200':
          description: Статус конкретной реплики app, обработавшей запрос
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    properties:
                      status: { type: string, example: ok }
                      instance: { type: string, example: "8857e133b9a7" }
                      db: { type: string, example: ok }
                      uptime: { type: integer, example: 1345 }

  /email-verification/verify:
    post:
      tags: [EmailVerification]
      operationId: verifyEmails
      summary: Массовая проверка списка строк на валидность email (формат + MX)
      description: >
        Проверка в 2 шага: формат по regex, затем DNS MX-запись домена (с fallback
        на A/AAAA). Письмо-подтверждение не отправляется. Максимум 100 адресов
        за запрос (см. SDD 3.2.11).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyEmailsRequest'
      responses:
        '200':
          description: Результаты проверки по каждому адресу
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyEmailsResponse'
        '400':
          description: Некорректный запрос или превышен лимит батча (BATCH_TOO_LARGE)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: integer }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PerPage:
      name: per_page
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }

  responses:
    ValidationError:
      description: Ошибка валидации входных данных
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: VALIDATION_ERROR
              message: Invalid input data
              details:
                - field: email
                  message: A valid email is required
    Unauthorized:
      description: Отсутствует или невалиден JWT
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error: { code: UNAUTHORIZED, message: "Authorization token is missing" }
    NotFound:
      description: Ресурс не найден или принадлежит другому пользователю
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error: { code: NOT_FOUND, message: "Wallet not found" }

  schemas:
    ErrorResponse:
      type: object
      properties:
        success: { type: boolean, example: false }
        error:
          type: object
          properties:
            code: { type: string, example: VALIDATION_ERROR }
            message: { type: string, example: Invalid input data }
            details:
              type: array
              items:
                type: object
                properties:
                  field: { type: string }
                  message: { type: string }

    PaginationMeta:
      type: object
      properties:
        page: { type: integer, example: 1 }
        per_page: { type: integer, example: 20 }
        total: { type: integer, example: 42 }

    User:
      type: object
      properties:
        id: { type: integer, example: 1 }
        email: { type: string, format: email, example: alice@example.com }
        name: { type: string, example: Alice }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    RegisterUserRequest:
      type: object
      required: [email, password, name]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 8, example: supersecret }
        name: { type: string, maxLength: 100, example: Alice }

    UpdateUserRequest:
      type: object
      properties:
        email: { type: string, format: email }
        name: { type: string, maxLength: 100 }

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, example: alice@example.com }
        password: { type: string, example: supersecret }

    TokenPairResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        data:
          type: object
          properties:
            access_token: { type: string }
            refresh_token: { type: string }
            token_type: { type: string, example: Bearer }
            expires_in: { type: integer, example: 900 }

    Account:
      type: object
      properties:
        id: { type: integer, example: 1 }
        name: { type: string, example: "Тинькофф Дебетовая" }
        type: { type: string, enum: [bank, card, cash, e-wallet] }
        requisites: { type: string, nullable: true, example: "**** 4321" }
        currency: { type: string, example: RUB }
        created_at: { type: string, format: date-time }

    CreateAccountRequest:
      type: object
      required: [name, type, currency]
      properties:
        name: { type: string, maxLength: 100 }
        type: { type: string, enum: [bank, card, cash, e-wallet] }
        requisites: { type: string, nullable: true, maxLength: 255 }
        currency: { type: string, pattern: '^[A-Z]{3}$', example: RUB }

    UpdateAccountRequest:
      type: object
      properties:
        name: { type: string, maxLength: 100 }
        type: { type: string, enum: [bank, card, cash, e-wallet] }
        requisites: { type: string, nullable: true, maxLength: 255 }
        currency: { type: string, pattern: '^[A-Z]{3}$' }

    AccountListResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        data:
          type: array
          items: { $ref: '#/components/schemas/Account' }
        meta: { $ref: '#/components/schemas/PaginationMeta' }

    Wallet:
      type: object
      properties:
        id: { type: integer, example: 1 }
        account_id: { type: integer, nullable: true, example: 1 }
        name: { type: string, example: "Основной кошелёк" }
        currency: { type: string, example: RUB }
        balance:
          type: number
          format: float
          description: "Денормализованный кэш, пересчитывается TransactionsService"
          example: 3500.00
        is_default: { type: boolean }
        created_at: { type: string, format: date-time }

    CreateWalletRequest:
      type: object
      required: [name, currency]
      properties:
        name: { type: string, maxLength: 100 }
        currency: { type: string, pattern: '^[A-Z]{3}$', example: RUB }
        account_id: { type: integer, nullable: true }
        is_default: { type: boolean, default: false }

    UpdateWalletRequest:
      type: object
      properties:
        name: { type: string, maxLength: 100 }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        is_default: { type: boolean }

    WalletListResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        data:
          type: array
          items: { $ref: '#/components/schemas/Wallet' }
        meta: { $ref: '#/components/schemas/PaginationMeta' }

    Category:
      type: object
      properties:
        id: { type: integer, example: 1 }
        parent_id: { type: integer, nullable: true }
        name: { type: string, example: Groceries }
        type: { type: string, enum: [income, expense] }
        created_at: { type: string, format: date-time }

    CreateCategoryRequest:
      type: object
      required: [name, type]
      properties:
        name: { type: string, maxLength: 100 }
        type: { type: string, enum: [income, expense] }
        parent_id: { type: integer, nullable: true }

    UpdateCategoryRequest:
      type: object
      properties:
        name: { type: string, maxLength: 100 }
        type: { type: string, enum: [income, expense] }
        parent_id: { type: integer, nullable: true }

    CategoryListResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        data:
          type: array
          items: { $ref: '#/components/schemas/Category' }
        meta: { $ref: '#/components/schemas/PaginationMeta' }

    Tag:
      type: object
      properties:
        id: { type: integer, example: 1 }
        name: { type: string, example: urgent }
        color: { type: string, example: "#FF0000" }
        created_at: { type: string, format: date-time }

    CreateTagRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 50 }
        color: { type: string, pattern: '^#[0-9A-Fa-f]{6}$', default: "#CCCCCC" }

    UpdateTagRequest:
      type: object
      properties:
        name: { type: string, maxLength: 50 }
        color: { type: string, pattern: '^#[0-9A-Fa-f]{6}$' }

    TagListResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        data:
          type: array
          items: { $ref: '#/components/schemas/Tag' }
        meta: { $ref: '#/components/schemas/PaginationMeta' }

    Transaction:
      type: object
      properties:
        id: { type: integer, example: 1 }
        wallet_id: { type: integer }
        category_id: { type: integer }
        type: { type: string, enum: [income, expense] }
        amount: { type: number, format: float, example: 1500.00 }
        description: { type: string, nullable: true }
        date: { type: string, format: date }
        created_at: { type: string, format: date-time }
        tags:
          type: array
          items: { type: integer }

    CreateTransactionRequest:
      type: object
      required: [wallet_id, category_id, type, amount, date]
      properties:
        wallet_id: { type: integer }
        category_id: { type: integer }
        type: { type: string, enum: [income, expense] }
        amount: { type: number, format: float, exclusiveMinimum: true, minimum: 0 }
        description: { type: string, nullable: true }
        date: { type: string, format: date }
        tags:
          type: array
          items: { type: integer }

    UpdateTransactionRequest:
      type: object
      properties:
        wallet_id: { type: integer }
        category_id: { type: integer }
        type: { type: string, enum: [income, expense] }
        amount: { type: number, format: float, exclusiveMinimum: true, minimum: 0 }
        description: { type: string, nullable: true }
        date: { type: string, format: date }
        tags:
          type: array
          items: { type: integer }

    TransactionListResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        data:
          type: array
          items: { $ref: '#/components/schemas/Transaction' }
        meta: { $ref: '#/components/schemas/PaginationMeta' }

    VerifyEmailsRequest:
      type: object
      required: [emails]
      properties:
        emails:
          type: array
          minItems: 1
          maxItems: 100
          items: { type: string }
          example: ["user@gmail.com", "invalid-email", "test@nonexistent-domain-xyz.invalid"]

    VerifyEmailsResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        data:
          type: object
          properties:
            results:
              type: array
              items:
                type: object
                properties:
                  email: { type: string }
                  domain: { type: string, nullable: true }
                  valid: { type: boolean }
                  status:
                    type: string
                    enum: [valid, invalid_format, no_mx_record, lookup_failed]
            summary:
              type: object
              properties:
                total: { type: integer }
                valid: { type: integer }
                invalid: { type: integer }
